<body data-page="login">
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="auth">
    <div class="auth__visual " role="img" aria-label="Identidade visual JHEN beauty care">
      <div class="auth__visual-note"><p>Que bom ter você de volta.</p></div>
    </div>
    <main class="auth__panel" id="main" tabindex="-1">
      <div class="auth__box">
        <a class="auth__logo" href="index.html"><img src="assets/logo/logo-jhen-vinho.png" alt="JHEN beauty care — voltar ao site" width="122" height="52"></a>

        <h1>Entrar</h1>
        <p class="muted">Acesse sua área para agendar, remarcar e acompanhar seus horários.</p>
        <div id="form-alert" hidden></div>
        <form class="form" id="login-form" novalidate style="margin-top:var(--space-5)">
          <div class="field"><label for="email">E-mail</label><input class="input" type="email" id="email" name="email" autocomplete="email" inputmode="email" required></div>
          <div class="field"><label for="password">Senha</label>
            <div class="input-group"><input class="input" type="password" id="password" name="password" autocomplete="current-password" required >
            <button class="input-group__btn" type="button" data-toggle-password aria-label="Mostrar senha"></button></div></div>
          <div class="auth__row"><span></span><a href="recuperar-senha.html">Esqueci minha senha</a></div>
          <button class="btn btn--block btn--lg" type="submit">Entrar</button>
        </form>
        <p class="auth__alt">Ainda não tem conta? <a href="cadastro.html" id="signup-link">Criar conta</a></p>
      </div>
    </main>
  </div>
</body>
</html>

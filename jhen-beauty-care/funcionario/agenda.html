<body data-page="agenda">
  <a class="skip-link" href="#content">Pular para o conteúdo</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação da área"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 class="topbar__title">Minha agenda</h1>
        <div class="topbar__actions"></div>
      </header>
      <main class="content" id="content" tabindex="-1">

        <div class="toolbar">
          <div class="segmented" id="agenda-filters" role="group" aria-label="Período">
            <button type="button" data-filter="today" aria-pressed="true">Hoje</button>
            <button type="button" data-filter="tomorrow" aria-pressed="false">Amanhã</button>
            <button type="button" data-filter="week" aria-pressed="false">Semana</button>
            <button type="button" data-filter="month" aria-pressed="false">Mês</button>
            <button type="button" data-filter="history" aria-pressed="false">Histórico</button>
          </div>
          <div class="range-nav">
            <button class="icon-btn" type="button" id="range-prev" aria-label="Período anterior"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
            <strong id="range-label" class="range-nav__label" aria-live="polite"></strong>
            <button class="icon-btn" type="button" id="range-next" aria-label="Próximo período"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
          </div>
        </div>
        <div id="agenda-list" aria-live="polite"></div>
      </main>
    </div>
  </div>

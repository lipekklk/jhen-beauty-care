      <main class="content" id="content" tabindex="-1">

        <div id="settings-root">
          <div class="tabs" role="tablist" id="settings-tabs" aria-label="Configurações">

          <section class="tab-panel" id="tp-datas" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tp-bloqueios" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tp-politicas" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tp-pagamentos" role="tabpanel" hidden></section>
          <section class="tab-panel" id="tp-contato" role="tabpanel" hidden></section>

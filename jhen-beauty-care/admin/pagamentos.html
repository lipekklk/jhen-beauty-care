<body data-page="pagamentos">
  <a class="skip-link" href="#content">Pular para o conteúdo</a>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Navegação da área"></aside>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn topbar__menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <h1 class="topbar__title">Pagamentos</h1>
        <div class="topbar__actions"></div>
      </header>
      <main class="content" id="content" tabindex="-1">

        <form class="toolbar" id="filters">
          <div class="field"><label for="p-from" class="field-label">De</label><input class="input" type="date" id="p-from" name="from"></div>
          <div class="field"><label for="p-to" class="field-label">Até</label><input class="input" type="date" id="p-to" name="to"></div>
          <div class="field"><label for="p-status" class="field-label">Status</label><select class="select" id="p-status" name="status"></select></div>
          <div class="field"><label for="p-method" class="field-label">Forma</label><select class="select" id="p-method" name="method"></select></div>
        </form>
        <div class="stats" id="payment-totals" aria-live="polite"></div>
        <div id="payments-table" aria-live="polite"></div>
        <p class="hint">Dados de cartão nunca passam por este sistema: guardamos apenas o ID e o status do pagamento no gateway.</p>
      </main>
    </div>
  </div>
</body>
</html>
